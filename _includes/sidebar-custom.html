{% if page.layout == "home" %}
  <nav class="nav__list">
    <h3 class="nav__title" style="padding-left: 0;">Recent Posts</h3>
    <ul class="nav__items">
      {% for post in site.posts limit: 5 %}
        <li>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
          <br>
          <small>{{ post.date | date: "%b %-d, %Y" }}</small>
        </li>
      {% endfor %}
    </ul>
  </nav>
{% endif %}
